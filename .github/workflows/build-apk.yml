name: Build Birch OS APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/build-apk.yml"
permissions:
  contents: write
concurrency:
  group: birch-build
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.BIRCH_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BIRCH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BIRCH_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BIRCH_KEY_PASSWORD }}
        run: |
          set -e
          echo "BIRCH_KEYSTORE_BASE64 length: ${#KS_B64}"
          if [ -z "$KS_B64" ]; then
            echo "::error::Missing secret BIRCH_KEYSTORE_BASE64"
            exit 1
          fi
          python3 - <<'PY'
          import os, base64, pathlib
          raw = os.environ["KS_B64"].strip().replace("\n","").replace("\r","").replace(" ","")
          data = base64.b64decode(raw)
          pathlib.Path(os.environ["RUNNER_TEMP"], "birch.jks").write_bytes(data)
          print("decoded", len(data), "bytes")
          PY
          export BIRCH_KEYSTORE_PASSWORD="${KS_PASS:-birchos}"
          keytool -list -keystore "$RUNNER_TEMP/birch.jks" -storepass "$BIRCH_KEYSTORE_PASSWORD"
          echo "Keystore OK"

      - name: Install Android SDK
        run: |
          set -e
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -qo /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build and sign
        env:
          BIRCH_KEYSTORE_PASSWORD: ${{ secrets.BIRCH_KEYSTORE_PASSWORD }}
          BIRCH_KEY_ALIAS: ${{ secrets.BIRCH_KEY_ALIAS }}
          BIRCH_KEY_PASSWORD: ${{ secrets.BIRCH_KEY_PASSWORD }}
          KS_B64: ${{ secrets.BIRCH_KEYSTORE_BASE64 }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export ANDROID_HOME=$HOME/android-sdk
          export BT="$ANDROID_HOME/build-tools/34.0.0"
          export PF="$ANDROID_HOME/platforms/android-34"
          export VERSION_CODE=$((59 + VERSION_CODE))
          if [ "$VERSION_CODE" -lt 84 ]; then VERSION_CODE=84; fi
          echo "$VERSION_CODE" > /tmp/version_code.txt
          echo "Building versionCode=$VERSION_CODE"
          export BIRCH_KEYSTORE_PASSWORD="${BIRCH_KEYSTORE_PASSWORD:-birchos}"
          export BIRCH_KEY_ALIAS="${BIRCH_KEY_ALIAS:-birch}"
          export BIRCH_KEY_PASSWORD="${BIRCH_KEY_PASSWORD:-$BIRCH_KEYSTORE_PASSWORD}"
          python3 - <<'PY'
          import os, base64, pathlib
          raw = os.environ["KS_B64"].strip().replace("\n","").replace("\r","").replace(" ","")
          pathlib.Path(os.environ["RUNNER_TEMP"], "birch.jks").write_bytes(base64.b64decode(raw))
          PY
          export KS="$RUNNER_TEMP/birch.jks"
          sed -i 's/javac -source 8 -target 8 -nowarn/javac -encoding UTF-8 -source 8 -target 8 -nowarn/' launcher/native-android/build.sh || true
          bash launcher/native-android/build.sh
          ls -la /tmp/birch-build/birchos-launcher.apk
          rm -f "$RUNNER_TEMP/birch.jks"

      - name: version.json
        run: |
          code=$(cat /tmp/version_code.txt)
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$code" "$code" > version.json
          echo "code=$code" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.code }}
          name: Birch OS ${{ env.code }}
          files: |
            /tmp/birch-build/birchos-launcher.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
