name: Build Birch OS APK
on:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Restore the Birch signing key
        env:
          BIRCH_KEYSTORE_BASE64: ${{ secrets.BIRCH_KEYSTORE_BASE64 }}
        run: |
          test -n "$BIRCH_KEYSTORE_BASE64" || (echo "Missing secret BIRCH_KEYSTORE_BASE64" && exit 1)
          mkdir -p launcher/native-android/keystore
          printf '%s' "$BIRCH_KEYSTORE_BASE64" | base64 -d > launcher/native-android/keystore/birch-release.jks
      - name: Build
        env:
          BT: ${{ env.ANDROID_SDK_ROOT }}/build-tools/34.0.0
          PF: ${{ env.ANDROID_SDK_ROOT }}/platforms/android-34
        run: bash launcher/native-android/build.sh
      - name: Version code
        id: ver
        run: echo "code=$(sed -n 's/.*versionCode="\([0-9]*\)".*/\1/p' launcher/native-android/AndroidManifest.xml)" >> "$GITHUB_OUTPUT"
      - name: version.json
        run: |
          code="${{ steps.ver.outputs.code }}"
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$code" "$code" > version.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.code }}
          name: Birch OS ${{ steps.ver.outputs.code }}
          files: |
            /tmp/birch-build/birchos-launcher.apk
            version.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
