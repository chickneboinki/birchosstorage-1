name: Build Birch OS APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/build-apk.yml"
permissions:
  contents: write
concurrency:
  group: birch-build
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Android SDK 34
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Check the signing secret
        env:
          A: ${{ secrets.BIRCH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$A" ]; then
            echo "::error::Missing secret BIRCH_KEYSTORE_BASE64 (base64 of the Birch keystore). Passwords default to birchos / alias birch."
            exit 1
          fi
      - name: Build and sign
        env:
          BT: ${{ env.ANDROID_SDK_ROOT }}/build-tools/34.0.0
          PF: ${{ env.ANDROID_SDK_ROOT }}/platforms/android-34
          BIRCH_KEYSTORE_PASSWORD: ${{ secrets.BIRCH_KEYSTORE_PASSWORD }}
          BIRCH_KEY_ALIAS: ${{ secrets.BIRCH_KEY_ALIAS }}
          BIRCH_KEY_PASSWORD: ${{ secrets.BIRCH_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          # Keep updates newer than the v56 sideload. run_number starts small on a new workflow, so add 56.
          export VERSION_CODE=$((56 + VERSION_CODE))
          echo "$VERSION_CODE" > /tmp/version_code.txt
          # Defaults from README when optional secrets are empty
          export BIRCH_KEYSTORE_PASSWORD="${BIRCH_KEYSTORE_PASSWORD:-birchos}"
          export BIRCH_KEY_ALIAS="${BIRCH_KEY_ALIAS:-birch}"
          export BIRCH_KEY_PASSWORD="${BIRCH_KEY_PASSWORD:-$BIRCH_KEYSTORE_PASSWORD}"
          mkdir -p "$RUNNER_TEMP"
          echo "${{ secrets.BIRCH_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/birch.jks"
          export KS="$RUNNER_TEMP/birch.jks"
          bash launcher/native-android/build.sh
          rm -f "$RUNNER_TEMP/birch.jks"
      - name: version.json
        run: |
          code=$(cat /tmp/version_code.txt)
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$code" "$code" > version.json
          echo "code=$code" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.code }}
          name: Birch OS ${{ env.code }}
          files: |
            /tmp/birch-build/birchos-launcher.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
