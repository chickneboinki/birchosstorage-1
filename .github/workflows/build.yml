name: Build Birch OS APK

on:
  push:
    branches: [main]
    paths: ['native-android/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: birch-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the signing secrets exist
        env:
          A: ${{ secrets.BIRCH_KEYSTORE_BASE64 }}
          B: ${{ secrets.BIRCH_KEYSTORE_PASSWORD }}
          C: ${{ secrets.BIRCH_KEY_ALIAS }}
          D: ${{ secrets.BIRCH_KEY_PASSWORD }}
        run: |
          for v in A B C D; do
            if [ -z "${!v}" ]; then echo "::error::A signing secret is missing. Add all four BIRCH_* secrets (Settings > Secrets and variables > Actions)."; exit 1; fi
          done

      - name: Find the Android build tools
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -d "$SDK/platforms/android-34" ] || ! ls "$SDK/build-tools" 2>/dev/null | grep -q '^3[4-9]'; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          fi
          BTV=$(ls "$SDK/build-tools" | sort -V | grep -E '^3[4-9]' | tail -1)
          echo "BT=$SDK/build-tools/$BTV" >> "$GITHUB_ENV"
          echo "PF=$SDK/platforms/android-34" >> "$GITHUB_ENV"

      - name: Bundle the real Qaisflixx and Qaisifyy apps
        run: bash native-android/apps/build-apps.sh

      - name: Build and sign the APK
        env:
          KS_B64: ${{ secrets.BIRCH_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BIRCH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BIRCH_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BIRCH_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/birch.jks"
          export KS="$RUNNER_TEMP/birch.jks"
          export VERSION_CODE=$((60 + GITHUB_RUN_NUMBER))
          export VERSION_NAME="build-$VERSION_CODE"
          export EXPECTED_SHA256="d301909bff6c9516dab689c5eb8436a224a224d5f09ec5f0c9441f281b515775"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          bash native-android/build.sh
          rm -f "$RUNNER_TEMP/birch.jks"

      - name: Publish a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_CODE" build-out/birchos-launcher.apk \
            --title "Birch OS build $VERSION_CODE" \
            --notes "versionCode: $VERSION_CODE" --latest
